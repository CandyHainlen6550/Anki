name: Build and verify HT Joyo 2136

on:
  workflow_dispatch:
  push:
    paths:
      - 'builder/**'
      - 'data/master/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'SOURCE_REFS.env'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: anki-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate repository source
        shell: bash
        run: |
          set -euo pipefail
          test -f builder/build_anki.py
          test -f data/master/joyo2136_learning_bundle.json
          test -f scripts/fetch_sources.sh
          test -f scripts/fetch_glyphwiki.py
          test -f scripts/build.sh
          test -f scripts/verify_build.py
          test -f scripts/make_snapshot.py
          test -f SOURCE_REFS.env
          python3 -m py_compile builder/build_anki.py scripts/fetch_glyphwiki.py scripts/verify_build.py scripts/make_snapshot.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          master=json.loads(Path('data/master/joyo2136_learning_bundle.json').read_text(encoding='utf-8'))
          assert len(master.get('kanji',[])) == 2136
          print('Master source OK: 2136')
          PY

      - name: Fetch pinned upstreams, build and verify
        shell: bash
        run: bash scripts/build.sh

      - name: Validate outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/HT Joyo 2136.apkg"
          test -s dist/QA.json
          test -s dist/builder_report.json
          test -s dist/repo_order_snapshot.json
          test -s dist/source_manifest.json
          test -s dist/SHA256SUMS.txt
          if find dist -maxdepth 1 -type f -name '*.apkg' ! -name 'HT Joyo 2136.apkg' | grep -q .; then
            echo 'Unexpected renamed APKG found in dist/' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          qa=json.loads(Path('dist/QA.json').read_text(encoding='utf-8'))
          assert qa.get('ok') is True, qa
          assert qa.get('notes') == 3336
          assert qa.get('cards') == 10008
          assert qa['stable_identity']['apkg_filename'] == 'HT Joyo 2136.apkg'
          print('Build QA OK: HT Joyo 2136')
          PY

      - name: Commit verified dist
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dist
          if git diff --cached --quiet; then
            echo 'No dist changes.'
          else
            git commit -m 'Rebuild verified HT Joyo 2136 APKG [skip ci]'
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HT-Joyo-2136
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/HT Joyo 2136.apkg
            dist/QA.json
            dist/builder_report.json
            dist/repo_order_snapshot.json
            dist/source_manifest.json
            dist/SHA256SUMS.txt
