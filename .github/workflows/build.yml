name: Build and verify HT Joyo 2136

on:
  workflow_dispatch:
  push:
    paths:
      - 'builder/**'
      - 'data/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'SOURCE_REFS.env'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: anki-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Normalize recursive chevron alignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('builder/build_anki.py')
          s = p.read_text(encoding='utf-8')
          marker = 'M3 5.5L8 10.5L13 5.5'
          if marker not in s:
              old_css = '.comp-recursive-chevron{display:inline-block;font-size:20px;line-height:1;transition:transform .18s ease;transform-origin:center}.comp-recursive[open]>.comp-recursive-summary .comp-recursive-chevron{transform:rotate(180deg)}'
              new_css = '.comp-recursive-chevron{width:18px;height:18px;flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;transition:transform .18s ease;transform-origin:center}.comp-recursive-chevron svg{width:14px;height:14px;display:block;overflow:visible}.comp-recursive-chevron path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.comp-recursive[open]>.comp-recursive-summary .comp-recursive-chevron{transform:rotate(180deg)}'
              old_arrow = '>⌄</span>'
              new_arrow = '><svg viewBox="0 0 16 16" focusable="false" aria-hidden="true"><path d="M3 5.5L8 10.5L13 5.5"/></svg></span>'
              if old_css not in s or old_arrow not in s:
                  raise SystemExit('Recursive chevron source changed; refusing unsafe patch')
              s = s.replace(old_css, new_css, 1).replace(old_arrow, new_arrow, 1)
              p.write_text(s, encoding='utf-8')
              print('Applied centered SVG chevron patch.')
          else:
              print('Centered SVG chevron already present.')
          PY

      - name: Normalize writer hint animation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('builder/build_anki.py')
          s = p.read_text(encoding='utf-8')
          old = "p.style.transition='stroke-dashoffset .68s linear';p.style.strokeDashoffset='0'})})}catch(e){}setTimeout(function(){try{hints.innerHTML=''}catch(e){}},1050)"
          new = "p.style.transition='stroke-dashoffset .32s linear';p.style.strokeDashoffset='0'})})}catch(e){}setTimeout(function(){try{hints.innerHTML=''}catch(e){}},620)"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('Sped up writer hint animation to 0.32s.')
          elif new in s:
              print('Fast writer hint animation already present.')
          else:
              raise SystemExit('Writer hint source changed; refusing unsafe patch')
          PY

      - name: Validate repository sources
        shell: bash
        run: |
          set -euo pipefail
          test -f builder/build_anki.py
          test -f data/master/kanji.json
          test -f data/ht/sc1.json
          test -f data/ht/sc2.json
          test -f data/ht/mnemonics.json
          test -f data/ht/learner_decomp.json
          test -f data/ht/SOURCE.json
          test ! -e data/master/joyo2136_learning_bundle.json
          test ! -e scripts/build_anki_entry.py
          test ! -e scripts/pin_ht_main.sh
          python3 -m py_compile builder/build_anki.py scripts/fetch_glyphwiki.py scripts/verify_build.py scripts/make_snapshot.py scripts/sync_from_ht.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          master=json.loads(Path('data/master/kanji.json').read_text(encoding='utf-8'))
          mn=json.loads(Path('data/ht/mnemonics.json').read_text(encoding='utf-8'))
          decomp=json.loads(Path('data/ht/learner_decomp.json').read_text(encoding='utf-8'))
          sc1=json.loads(Path('data/ht/sc1.json').read_text(encoding='utf-8'))
          sc2=json.loads(Path('data/ht/sc2.json').read_text(encoding='utf-8'))
          assert len(master.get('kanji',[])) == 2136
          assert len({r['kanji'] for r in master['kanji']}) == 2136
          assert len(sc1) == 400 and len(sc2) == 844
          assert int(decomp.get('joyoCount') or 0) == 2136
          assert all(str(mn.get(r['kanji'],'')).strip() for r in master['kanji'])
          def has_mnemonic(v):
              if isinstance(v,dict):
                  return any(str(k).lower()=='mnemonic' or has_mnemonic(x) for k,x in v.items())
              if isinstance(v,list): return any(has_mnemonic(x) for x in v)
              return False
          assert not has_mnemonic(sc1) and not has_mnemonic(sc2)
          print('Split learning sources OK: 2136 / 400 / 844')
          PY

      - name: Fetch external sources, build and verify
        shell: bash
        run: bash scripts/build.sh

      - name: Validate outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/HT Joyo 2136.apkg"
          test -s dist/QA.json
          test -s dist/builder_report.json
          test -s dist/repo_order_snapshot.json
          test -s dist/source_manifest.json
          test -s dist/SHA256SUMS.txt
          if find dist -maxdepth 1 -type f -name '*.apkg' ! -name 'HT Joyo 2136.apkg' | grep -q .; then
            echo 'Unexpected renamed APKG found in dist/' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          qa=json.loads(Path('dist/QA.json').read_text(encoding='utf-8'))
          assert qa.get('ok') is True, qa
          assert qa.get('counts_ok') is True, qa
          assert qa.get('notes') == 3380 and qa.get('cards') == 10140
          assert qa.get('repo_order', {}).get('sc1_count') == 400
          assert qa.get('repo_order', {}).get('sc2_count') == 844
          assert qa.get('sc2_canonical_source', {}).get('ok') is True
          assert qa.get('learning_sources', {}).get('mnemonic_mismatch_count') == 0
          assert qa.get('learning_sources', {}).get('raw_technical_mnemonic_leak_count') == 0
          assert all(qa.get('components', {}).get('learner_decomp_regressions', {}).values())
          assert qa['stable_identity']['apkg_filename'] == 'HT Joyo 2136.apkg'
          print('Build QA OK: centralized mnemonic/decomposition, 3380 notes / 10140 cards')
          PY

      - name: Commit verified builder and dist
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builder/build_anki.py dist
          if git diff --cached --quiet; then
            echo 'No builder/dist changes.'
          else
            git commit -m 'Rebuild verified HT Joyo 2136 APKG [skip ci]'
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: HT-Joyo-2136
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/HT Joyo 2136.apkg
            dist/QA.json
            dist/builder_report.json
            dist/repo_order_snapshot.json
            dist/source_manifest.json
            dist/SHA256SUMS.txt
